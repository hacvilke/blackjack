apply plugin: 'com.android.application'

android {
    namespace 'com.hacvilke.blackjack'
    compileSdk 34
    defaultConfig {
        applicationId 'com.hacvilke.blackjack'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug // sideload-friendly: debug-signed release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

