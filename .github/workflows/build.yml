name: Blackjack — Android APK + iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Install Platform 34 & Build-Tools 34.0.0
        run: |
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Bundle game into the app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r www/* android/app/src/main/assets/www/

      - name: Build APKs
        run: |
          gradle -p android assembleDebug assembleRelease

      - name: Name artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Blackjack-v1.0.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Blackjack-v1.0.0-debug.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Blackjack-APK
          path: dist/*.apk

  ios:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wrap the game with Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@5 @capacitor/cli@5 @capacitor/ios@5 --no-audit --no-fund
          mkdir -p www
          cp www/index.html www/manifest.webmanifest www/icon.svg www/ 2>/dev/null || true
          npx --yes @capacitor/cli@5 init "Blackjack" "com.hacvilke.blackjack" --web-dir www
          npx --yes @capacitor/cli@5 add ios
          npx --yes @capacitor/cli@5 copy ios

      - name: Archive (unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload dist
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry dist/Blackjack-unsigned.ipa Payload
          ls -lh dist

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blackjack-IPA-unsigned
          path: dist/Blackjack-unsigned.ipa
